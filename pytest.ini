[pytest]
# Only collect tests from directories named 'tests', preventing pytest from
# mistakenly treating production modules (e.g. surrogates.test_loop) as tests.
testpaths =
    Coarse_Graining_IBMS
pythonpath =
    Coarse_Graining_IBMS/src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (run with -m slow)
